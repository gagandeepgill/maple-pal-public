name: Release

on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:
    inputs:
      force:
        description: Build even if main has not moved
        type: boolean
        default: false
      ref:
        description: Branch to build. Anything but main becomes a test pre-release that the next main release replaces.
        type: string
        default: main

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 75
    defaults:
      run:
        shell: bash
    steps:
      # A read-only deploy key on the private repo; nothing else of it is reachable from here.
      - uses: actions/checkout@v4
        with:
          repository: ${{ vars.SOURCE_REPO }}
          ssh-key: ${{ secrets.SOURCE_DEPLOY_KEY }}
          ref: ${{ inputs.ref || 'main' }}
          fetch-depth: 0
          persist-credentials: false

      - name: Compare main with the newest release
        id: plan
        run: |
          main=$(git rev-parse HEAD)
          if [[ "${{ inputs.ref || 'main' }}" != main ]]; then
            echo "test=true" >>"$GITHUB_OUTPUT"
          fi
          released=$(curl -fsSL "https://github.com/$GITHUB_REPOSITORY/releases/latest/download/latest.json" 2>/dev/null | jq -r '.commit // empty' || true)
          echo "previous=$released" >>"$GITHUB_OUTPUT"
          if [[ $main == "$released" && "${{ inputs.force }}" != true && "${{ inputs.ref || 'main' }}" == main ]]; then
            echo "Main is already released."
            echo "build=false" >>"$GITHUB_OUTPUT"
          else
            echo "build=true" >>"$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.plan.outputs.build == 'true'
        with:
          python-version: '3.13'

      - uses: actions/setup-node@v4
        if: steps.plan.outputs.build == 'true'
        with:
          node-version: '24'

      - uses: dtolnay/rust-toolchain@stable
        if: steps.plan.outputs.build == 'true'

      - uses: Swatinem/rust-cache@v2
        if: steps.plan.outputs.build == 'true'
        with:
          workspaces: desktop/src-tauri

      - name: Fast tests
        if: steps.plan.outputs.build == 'true'
        run: |
          python -m pip install --quiet --disable-pip-version-check -r requirements-widget.txt
          python -m unittest discover -s tests -q 2>&1 | tail -n 3
          npm --prefix desktop ci --no-audit --no-fund --loglevel=error
          npm --prefix desktop test -- --reporter=dot 2>&1 | tail -n 4

      - name: Build the installer
        if: steps.plan.outputs.build == 'true'
        env:
          FIELD_GUIDE_UPDATE_REPO: ${{ github.repository }}
          FIELD_GUIDE_PREVIOUS_COMMIT: ${{ steps.plan.outputs.previous }}
          FIELD_GUIDE_ALLOW_TEST: ${{ steps.plan.outputs.test == 'true' && '1' || '0' }}
          TAURI_UPDATER_PUBKEY: ${{ vars.TAURI_UPDATER_PUBKEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: bash tools/release/build-installer.sh

      # Ways for a player to check the download before running it: a SHA-256 checksum, a
      # signed GitHub attestation that this workflow built it, and (when the repo has a
      # VIRUSTOTAL_API_KEY secret) a VirusTotal scan.
      - name: Checksum, attestation and scan
        id: trust
        if: steps.plan.outputs.build == 'true'
        env:
          VT_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}
        run: |
          cd release-out
          sha=$(sha256sum MaplePal-Field-Guide-setup.exe | cut -d' ' -f1)
          echo "$sha  MaplePal-Field-Guide-setup.exe" > SHA256SUMS.txt
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          scan=""
          if [[ -n "$VT_KEY" ]]; then
            upload=$(curl -fsS -H "x-apikey: $VT_KEY" https://www.virustotal.com/api/v3/files/upload_url | python -c "import json,sys; print(json.load(sys.stdin)['data'])") \
              && curl -fsS -H "x-apikey: $VT_KEY" -F "file=@MaplePal-Field-Guide-setup.exe" "$upload" >/dev/null \
              && scan="https://www.virustotal.com/gui/file/$sha" \
              || echo "::warning::The VirusTotal upload failed; the release goes out without a scan link."
          fi
          # The README badge reads virustotal.json (a shields.io endpoint) from the rolling
          # "virustotal" release. Wait up to 8 minutes for the engines to finish.
          if [[ -n $scan ]]; then
            message=scanned color=blue last=""
            for _ in $(seq 32); do
              sleep 15
              stats=$(curl -fsS -H "x-apikey: $VT_KEY" "https://www.virustotal.com/api/v3/files/$sha" 2>/dev/null \
                | python -c "import json,sys; a=json.load(sys.stdin)['data']['attributes']; s=a['last_analysis_stats']; assert a.get('last_analysis_date') and sum(s.values()) >= 40; print(s['malicious']+s['suspicious'], s['malicious']+s['suspicious']+s['harmless']+s['undetected'])" 2>/dev/null) || continue
              read -r flagged total <<<"$stats"
              # Engines report over a few minutes; take the result once two checks agree.
              [[ $stats == "${last:-}" ]] || { last=$stats; continue; }
              message="$flagged / $total engines flagged"
              if [[ $flagged == 0 ]]; then message="clean ($total engines)" color=brightgreen
              elif (( flagged <= 2 )); then color=yellow
              else color=red; fi
              break
            done
            printf '{"schemaVersion":1,"label":"VirusTotal","message":"%s","color":"%s"}\n' "$message" "$color" > virustotal.json
            echo "VirusTotal: $message"
          fi
          echo "scan=$scan" >> "$GITHUB_OUTPUT"
          {
            echo
            echo '> This is a beta, so some things may not work yet. If something looks off, [let us know](https://github.com/'"$GITHUB_REPOSITORY"'/issues/new/choose).'
            echo
            echo '### Check this download'
            echo
            echo "- SHA-256: \`$sha\`"
            echo '- Built by this repository'"'"'s public GitHub Actions workflow, with a signed build attestation: run `gh attestation verify MaplePal-Field-Guide-setup.exe --repo '"$GITHUB_REPOSITORY"'`'
            if [[ -n "$scan" ]]; then echo "- [VirusTotal scan]($scan)"; fi
          } >> notes.md
      - uses: actions/attest-build-provenance@v2
        if: steps.plan.outputs.build == 'true'
        with:
          subject-path: release-out/MaplePal-Field-Guide-setup.exe
      - name: Publish
        if: steps.plan.outputs.build == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(cat release-out/version.txt)
          files=(release-out/MaplePal-Field-Guide-setup.exe release-out/MaplePal-Field-Guide-setup.exe.sig release-out/latest.json release-out/SHA256SUMS.txt)
          # Point the README's VirusTotal badge at the newest installer's scan: each main
          # release, or a test build while there is no main release yet.
          badge() {
            [[ -f release-out/virustotal.json ]] || return 0
            notes="The newest installer, $1, scanned by VirusTotal: ${{ steps.trust.outputs.scan }}"
            gh release view virustotal --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
              || gh release create virustotal --repo "$GITHUB_REPOSITORY" --target "${{ github.sha }}" --prerelease \
                   --title "Latest virus scan" --notes "$notes"
            gh release edit virustotal --repo "$GITHUB_REPOSITORY" --notes "$notes"
            gh release upload virustotal release-out/virustotal.json --repo "$GITHUB_REPOSITORY" --clobber
          }
          if [[ "${{ steps.plan.outputs.test }}" == true ]]; then
            tag="test-$(git rev-parse --short HEAD)"
            gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes >/dev/null 2>&1 || true
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "${{ github.sha }}" --prerelease \
              --title "Test build v$version" --notes-file release-out/notes.md "${files[@]}"
            echo "Download: https://github.com/$GITHUB_REPOSITORY/releases/download/$tag/MaplePal-Field-Guide-setup.exe"
            if [[ -z "${{ steps.plan.outputs.previous }}" ]]; then badge "test build v$version"; fi
            exit 0
          fi
          if gh release view "v$version" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "v$version is already published."
            exit 0
          fi
          gh release create "v$version" --repo "$GITHUB_REPOSITORY" --target "${{ github.sha }}" \
            --title "MaplePal Field Guide v$version" --notes-file release-out/notes.md --latest "${files[@]}"
          badge "v$version"
