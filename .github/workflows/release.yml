name: Release

on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:
    inputs:
      force:
        description: Build even if main has not moved
        type: boolean
        default: false
      ref:
        description: Branch to build. Anything but main becomes a test pre-release that the next main release replaces.
        type: string
        default: main

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # GitHub turns off schedules in a repo with no commits for 60 days; enabling resets that.
  keep-schedule:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/$GITHUB_REPOSITORY/actions/workflows/release.yml/enable" || echo "::warning::Could not refresh the schedule"

  release:
    runs-on: windows-latest
    timeout-minutes: 75
    defaults:
      run:
        shell: bash
    steps:
      # A read-only deploy key on the private repo; nothing else of it is reachable from here.
      - uses: actions/checkout@v7
        with:
          repository: ${{ vars.SOURCE_REPO }}
          ssh-key: ${{ secrets.SOURCE_DEPLOY_KEY }}
          ref: ${{ inputs.ref || 'main' }}
          fetch-depth: 0
          persist-credentials: false

      - name: Compare main with the newest release
        id: plan
        run: |
          main=$(git rev-parse HEAD)
          if [[ "${{ inputs.ref || 'main' }}" != main ]]; then
            echo "test=true" >>"$GITHUB_OUTPUT"
          fi
          released=$(curl -fsSL "https://github.com/$GITHUB_REPOSITORY/releases/latest/download/latest.json" 2>/dev/null | jq -r '.commit // empty' || true)
          echo "previous=$released" >>"$GITHUB_OUTPUT"
          build=true
          if [[ ! -f tools/release/build-installer.sh ]]; then
            echo "::notice::This commit has no installer script yet; nothing to build."
            build=false
          elif [[ "${{ inputs.force }}" == true || "${{ inputs.ref || 'main' }}" != main ]]; then
            build=true
          elif [[ $main == "$released" ]]; then
            echo "Main is already released."
            build=false
          elif [[ -n $released ]] && git cat-file -e "$released^{commit}" 2>/dev/null \
               && ! git diff --name-only "$released" HEAD | grep -qE '^(desktop/|vision/|exp_tracker/|quest/|niadb/|navigation/|requirements-widget\.txt|tools/release/)'; then
            # Only tests, tools or docs changed: players would download the same widget.
            echo "Nothing players run has changed since the last release."
            build=false
          fi
          echo "build=$build" >>"$GITHUB_OUTPUT"

      - uses: actions/setup-python@v7
        if: steps.plan.outputs.build == 'true'
        with:
          python-version: '3.13'

      - uses: actions/setup-node@v7
        if: steps.plan.outputs.build == 'true'
        with:
          node-version: '24'

      - uses: dtolnay/rust-toolchain@stable
        if: steps.plan.outputs.build == 'true'

      - uses: Swatinem/rust-cache@v2
        if: steps.plan.outputs.build == 'true'
        with:
          workspaces: desktop/src-tauri

      - name: Fast tests
        if: steps.plan.outputs.build == 'true'
        env:
          PYTHONUNBUFFERED: '1'  # piped output: keep test prints in order with the summary
        run: |
          python -m pip install --quiet --disable-pip-version-check -r requirements-widget.txt
          python -m unittest discover -s tests -q 2>&1 | tail -n 30
          npm --prefix desktop ci --no-audit --no-fund --loglevel=error
          npm --prefix desktop test -- --reporter=dot 2>&1 | tail -n 4

      # The full setup carries the game-data pack (about 140 MB): the data repo's copy in its
      # "game-data" release (game-data.yml), else MaplePal's route. It is kept between
      # runs and downloaded again only when the pack changes.
      - name: Game-data pack key
        id: pack
        if: steps.plan.outputs.build == 'true' && vars.FIELD_GUIDE_CATALOG_URL != ''
        run: |
          data="${{ vars.FIELD_GUIDE_DATA_REPO }}"
          id=$([[ -n $data ]] && curl -fsSL "https://github.com/$data/releases/download/game-data/game-data.json" 2>/dev/null | jq -r '.sha256 // empty' || true)
          if [[ -z $id ]]; then
            url="${{ vars.FIELD_GUIDE_CATALOG_URL }}"
            id=$(curl -fsSI --retry 5 --retry-all-errors "${url%/catalog.json.gz}/game-data.zip" | tr -d '\r' | sed -n 's/^[Ee][Tt][Aa][Gg]: *//p' | tail -n 1)
          fi
          echo "key=game-data-$(printf %s "$id" | sha256sum | cut -c1-16)" >>"$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        if: steps.pack.outputs.key
        with:
          path: ${{ runner.temp }}/maplepal-game-data
          key: ${{ steps.pack.outputs.key }}
          restore-keys: game-data-

      - name: Build the installers
        if: steps.plan.outputs.build == 'true'
        env:
          FIELD_GUIDE_GAME_DATA_CACHE: ${{ runner.temp }}/maplepal-game-data
          FIELD_GUIDE_UPDATE_REPO: ${{ github.repository }}
          FIELD_GUIDE_PREVIOUS_COMMIT: ${{ steps.plan.outputs.previous }}
          FIELD_GUIDE_ALLOW_TEST: ${{ steps.plan.outputs.test == 'true' && '1' || '0' }}
          # MaplePal's catalog route: every install downloads its library and game data there.
          FIELD_GUIDE_CATALOG_URL: ${{ vars.FIELD_GUIDE_CATALOG_URL }}
          # The data repo whose "game-data" release installs download from (game-data.yml).
          FIELD_GUIDE_DATA_REPO: ${{ vars.FIELD_GUIDE_DATA_REPO }}
          TAURI_UPDATER_PUBKEY: ${{ vars.TAURI_UPDATER_PUBKEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: bash tools/release/build-installer.sh

      # Ways for a player to check the download before running it: a SHA-256 checksum, a
      # signed GitHub attestation that this workflow built it, and (when the repo has a
      # VIRUSTOTAL_API_KEY secret) a VirusTotal scan.
      - name: Checksum, attestation and scan
        id: trust
        if: steps.plan.outputs.build == 'true'
        env:
          VT_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}
        run: |
          cd release-out
          sha=$(sha256sum MaplePal-Field-Guide-setup.exe | cut -d' ' -f1)
          sha256sum MaplePal-Field-Guide-setup.exe MaplePal-Field-Guide-update.exe > SHA256SUMS.txt
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          scan=""
          if [[ -n "$VT_KEY" ]]; then
            upload=$(curl -fsS -H "x-apikey: $VT_KEY" https://www.virustotal.com/api/v3/files/upload_url | python -c "import json,sys; print(json.load(sys.stdin)['data'])") \
              && curl -fsS -H "x-apikey: $VT_KEY" -F "file=@MaplePal-Field-Guide-setup.exe" "$upload" >/dev/null \
              && scan="https://www.virustotal.com/gui/file/$sha" \
              || echo "::warning::The VirusTotal upload failed; the release goes out without a scan link."
          fi
          # The README's VirusTotal badge shows the result: wait up to 8 minutes for the
          # engines to finish.
          flagged=0 total=0
          if [[ -n $scan ]]; then
            message=scanned color=blue last=""
            for _ in $(seq 32); do
              sleep 15
              stats=$(curl -fsS -H "x-apikey: $VT_KEY" "https://www.virustotal.com/api/v3/files/$sha" 2>/dev/null \
                | python -c "import json,sys; a=json.load(sys.stdin)['data']['attributes']; s=a['last_analysis_stats']; assert a.get('last_analysis_date') and sum(s.values()) >= 40; print(s['malicious']+s['suspicious'], s['malicious']+s['suspicious']+s['harmless']+s['undetected'])" 2>/dev/null) || continue
              read -r flagged total <<<"$stats"
              # Engines report over a few minutes; take the result once two checks agree.
              [[ $stats == "${last:-}" ]] || { last=$stats; continue; }
              message="$flagged / $total engines flagged"
              if [[ $flagged == 0 ]]; then message="clean ($total engines)" color=brightgreen
              elif (( flagged <= 2 )); then color=yellow
              else color=red; fi
              break
            done
            [[ $message == scanned ]] && flagged=0 total=0
            printf '{"schemaVersion":1,"label":"VirusTotal","message":"%s","color":"%s"}\n' "$message" "$color" > virustotal.json
            echo "VirusTotal: $message"
          fi
          echo "flagged=$flagged" >> "$GITHUB_OUTPUT"
          echo "total=$total" >> "$GITHUB_OUTPUT"
          echo "scan=$scan" >> "$GITHUB_OUTPUT"
          {
            echo
            echo '> This is a beta, so some things may not work yet. If something looks off, [let us know](https://github.com/'"$GITHUB_REPOSITORY"'/issues/new/choose).'
            echo
            echo '### Check this download'
            echo
            echo "- SHA-256: \`$sha\`"
            echo '- Built by this repository'"'"'s public GitHub Actions workflow, with a signed build attestation: run `gh attestation verify MaplePal-Field-Guide-setup.exe --repo '"$GITHUB_REPOSITORY"'`'
            if [[ -n "$scan" ]]; then echo "- [VirusTotal scan]($scan)"; fi
          } >> notes.md
      - uses: actions/attest-build-provenance@v4
        if: steps.plan.outputs.build == 'true'
        with:
          subject-path: |
            release-out/MaplePal-Field-Guide-setup.exe
            release-out/MaplePal-Field-Guide-update.exe
      # This repository itself, to redraw the README's VirusTotal badge.
      - uses: actions/checkout@v7
        if: steps.plan.outputs.build == 'true'
        with:
          path: site
      - name: Publish
        if: steps.plan.outputs.build == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(cat release-out/version.txt)
          # setup.exe (the download button) carries the game data; update.exe is what the
          # in-app updater fetches (latest.json), without it.
          files=(release-out/MaplePal-Field-Guide-setup.exe release-out/MaplePal-Field-Guide-update.exe release-out/latest.json release-out/SHA256SUMS.txt)
          [[ -f release-out/MaplePal-Field-Guide-update.exe.sig ]] && files+=(release-out/MaplePal-Field-Guide-update.exe.sig)
          # The update as parts (parts.json, its signature and one zip per part): installed
          # widgets download only the parts that changed.
          [[ -d release-out/parts ]] && files+=(release-out/parts/*)
          # Point the README's VirusTotal badge at the newest installer's scan: each main
          # release, or a test build while there is no main release yet.
          badge() {
            [[ -f release-out/virustotal.json ]] || return 0
            notes="The newest installer, $1, scanned by VirusTotal: ${{ steps.trust.outputs.scan }}"
            gh release view virustotal --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
              || gh release create virustotal --repo "$GITHUB_REPOSITORY" --target "${{ github.sha }}" --prerelease \
                   --title "Latest virus scan" --notes "$notes"
            gh release edit virustotal --repo "$GITHUB_REPOSITORY" --notes "$notes"
            gh release upload virustotal release-out/virustotal.json --repo "$GITHUB_REPOSITORY" --clobber
            # The badge image and its link, committed under the owner's name like every commit here.
            python site/.github/scripts/badge.py "${{ steps.trust.outputs.flagged }}" "${{ steps.trust.outputs.total }}" site/docs/badges/virustotal.svg
            (
              cd site
              git config user.name 'Gagandeep Gill'
              git config user.email '8551508+gagandeepgill@users.noreply.github.com'
              # The badge links straight to this installer's scan.
              sed -i -E 's#<a href="[^"]*"><img alt="VirusTotal#<a href="${{ steps.trust.outputs.scan }}"><img alt="VirusTotal#' README.md
              # A real release also redraws the "Latest" version badge.
              [[ "${{ steps.plan.outputs.test }}" == true ]] || python .github/scripts/badge.py version "$1" docs/badges/version.svg
              git add docs/badges/virustotal.svg docs/badges/version.svg README.md
              git diff --cached --quiet && exit 0
              git commit -q -m "Badges for $1"
              for attempt in 1 2 3; do
                git pull -q --rebase && git push -q && exit 0
                sleep 5
              done
              echo "::warning::Could not update the VirusTotal badge."
            ) || true
          }
          if [[ "${{ steps.plan.outputs.test }}" == true ]]; then
            tag="test-$(git rev-parse --short HEAD)"
            gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes >/dev/null 2>&1 || true
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "${{ github.sha }}" --prerelease \
              --title "Test build v$version" --notes-file release-out/notes.md "${files[@]}"
            echo "Download: https://github.com/$GITHUB_REPOSITORY/releases/download/$tag/MaplePal-Field-Guide-setup.exe"
            if [[ -z "${{ steps.plan.outputs.previous }}" ]]; then badge "test build v$version"; fi
            exit 0
          fi
          if gh release view "v$version" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "v$version is already published."
            exit 0
          fi
          gh release create "v$version" --repo "$GITHUB_REPOSITORY" --target "${{ github.sha }}" \
            --title "MaplePal Field Guide v$version" --notes-file release-out/notes.md --latest "${files[@]}"
          badge "v$version"
          # A main release replaces every test build; remove them so the list stays short.
          gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName --jq '.[].tagName' \
            | { grep '^test-' || true; } | while read -r old; do
              gh release delete "$old" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes || true
            done
